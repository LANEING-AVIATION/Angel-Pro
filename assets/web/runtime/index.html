<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    >
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none';"
    >
    <title>Angel Pro Offline Viewport</title>
    <style>
      html,
      body,
      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body {
        background: #ffffff;
        touch-action: none;
      }

      canvas {
        display: block;
      }

      #runtime-status {
        position: fixed;
        z-index: 1;
        top: 12px;
        left: 12px;
        padding: 7px 10px;
        border-radius: 7px;
        color: #ffffff;
        background: #8e8e93;
        font: 12px -apple-system, BlinkMacSystemFont, sans-serif;
      }

      #runtime-status[data-state="ready"] {
        background: #248a3d;
      }

      #runtime-status[data-state="error"] {
        background: #d70015;
      }

      #empty-scene {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        color: #8e8e93;
        font: 15px -apple-system, BlinkMacSystemFont, sans-serif;
        pointer-events: none;
      }

      #empty-scene[data-visible="true"] {
        display: grid;
      }
    </style>
  </head>
  <body>
    <output id="runtime-status" data-review-only>Starting offline renderer…</output>
    <output id="empty-scene">This project contains no renderable geometry.</output>
    <script src="../vendor/three.min.js"></script>
    <script>
      (() => {
        const status = document.querySelector('#runtime-status');
        const emptyScene = document.querySelector('#empty-scene');
        try {
          if (typeof THREE === 'undefined') {
            throw new Error('Bundled Three.js did not load');
          }

          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0xffffff);
          scene.add(new THREE.HemisphereLight(0xffffff, 0xd1d1d6, 1.35));
          const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
          keyLight.position.set(1, 1.5, 1);
          scene.add(keyLight);
          let modelRoot = new THREE.Group();
          scene.add(modelRoot);

          let camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
          camera.position.z = 5;

          const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: 'high-performance',
          });
          renderer.setPixelRatio(window.devicePixelRatio || 1);
          document.body.appendChild(renderer.domElement);

          const resize = () => {
            const width = Math.max(window.innerWidth, 1);
            const height = Math.max(window.innerHeight, 1);
            if (camera.isPerspectiveCamera) {
              camera.aspect = width / height;
            }
            camera.updateProjectionMatrix();
            renderer.setSize(width, height, false);
            if (modelRoot.children.length > 0) {
              fitCameraToModel();
            } else {
              renderer.render(scene, camera);
            }
          };

          const disposeModel = () => {
            scene.remove(modelRoot);
            modelRoot.traverse((object) => {
              if (object.geometry) object.geometry.dispose();
              if (object.material) {
                const materials = Array.isArray(object.material)
                  ? object.material
                  : [object.material];
                materials.forEach((material) => material.dispose());
              }
            });
            modelRoot = new THREE.Group();
            scene.add(modelRoot);
          };

          const geometryFromPoints = (points) => {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute(
              'position',
              new THREE.Float32BufferAttribute(points.flat(), 3),
            );
            return geometry;
          };

          const addEdges = (edges) => {
            edges.forEach((edge) => {
              if (!Array.isArray(edge.points) || edge.points.length < 2) return;
              const line = new THREE.Line(
                geometryFromPoints(edge.points),
                new THREE.LineBasicMaterial({ color: 0x3974c6 }),
              );
              line.userData.sourceEdgeIndex = edge.sourceIndex;
              modelRoot.add(line);
            });
          };

          const addLofts = (lofts) => {
            lofts.forEach((loft, loftOrder) => {
              const positions = [];
              const indices = [];
              const profiles = Array.isArray(loft.profiles) ? loft.profiles : [];
              profiles.forEach((profile) => {
                profile.points.forEach((point) => positions.push(...point));
              });
              let vertexOffset = 0;
              for (let profileIndex = 0;
                   profileIndex < profiles.length - 1;
                   profileIndex += 1) {
                const current = profiles[profileIndex].points;
                const next = profiles[profileIndex + 1].points;
                const pointCount = Math.min(current.length, next.length);
                const nextOffset = vertexOffset + current.length;
                for (let pointIndex = 0; pointIndex < pointCount - 1;
                     pointIndex += 1) {
                  const a = vertexOffset + pointIndex;
                  const b = nextOffset + pointIndex;
                  indices.push(a, b, a + 1, b, b + 1, a + 1);
                }
                vertexOffset = nextOffset;
              }
              if (indices.length === 0) return;
              const geometry = new THREE.BufferGeometry();
              geometry.setAttribute(
                'position',
                new THREE.Float32BufferAttribute(positions, 3),
              );
              geometry.setIndex(indices);
              geometry.computeVertexNormals();
              const mesh = new THREE.Mesh(
                geometry,
                new THREE.MeshPhongMaterial({
                  color: new THREE.Color().setHSL(
                    (0.56 + loftOrder * 0.035) % 1,
                    0.42,
                    0.68,
                  ),
                  side: THREE.DoubleSide,
                  shininess: 24,
                }),
              );
              mesh.userData.sourceLoftIndex = loft.sourceIndex;
              modelRoot.add(mesh);
            });
          };

          const fitCameraToModel = () => {
            const bounds = new THREE.Box3().setFromObject(modelRoot);
            if (bounds.isEmpty()) {
              camera.position.set(0, 0, 5);
              camera.near = 0.1;
              camera.far = 1000;
              camera.updateProjectionMatrix();
              camera.lookAt(0, 0, 0);
              emptyScene.dataset.visible = 'true';
              renderer.render(scene, camera);
              return false;
            }
            emptyScene.dataset.visible = 'false';
            const center = bounds.getCenter(new THREE.Vector3());
            const sphere = bounds.getBoundingSphere(new THREE.Sphere());
            const radius = Math.max(sphere.radius, 0.001);
            if (camera.isOrthographicCamera) {
              const aspect = Math.max(window.innerWidth, 1) /
                Math.max(window.innerHeight, 1);
              const halfHeight = radius * 1.18;
              const halfWidth = halfHeight * aspect;
              camera.left = -halfWidth;
              camera.right = halfWidth;
              camera.top = halfHeight;
              camera.bottom = -halfHeight;
              camera.position.copy(center).add(
                new THREE.Vector3(1, 0.65, 1)
                  .normalize()
                  .multiplyScalar(radius * 3),
              );
              camera.lookAt(center);
              camera.updateProjectionMatrix();
              renderer.render(scene, camera);
              return true;
            }
            const verticalHalfFov = THREE.MathUtils.degToRad(camera.fov * 0.5);
            const halfFov = Math.atan(
              Math.tan(verticalHalfFov) * Math.min(camera.aspect, 1),
            );
            const distance = radius / Math.sin(halfFov) * 1.18;
            const direction = new THREE.Vector3(1, 0.65, 1).normalize();
            camera.position.copy(center).addScaledVector(direction, distance);
            camera.near = Math.max(distance / 1000, 0.01);
            camera.far = distance + radius * 10;
            camera.updateProjectionMatrix();
            camera.lookAt(center);
            renderer.render(scene, camera);
            return true;
          };

          window.addEventListener('resize', resize, { passive: true });
          resize();

          const commandHandlers = new Map();
          window.__angelRuntime = Object.freeze({
            ready: true,
            threeRevision: THREE.REVISION,
            renderer: renderer.getContext() ? 'webgl' : 'unavailable',
          });
          window.__angelBridge = Object.freeze({
            register(type, handler) {
              if (typeof type !== 'string' || typeof handler !== 'function') {
                throw new TypeError('Invalid Angel command handler');
              }
              commandHandlers.set(type, handler);
            },
            async dispatch(command) {
              if (!window.__angelRuntime.ready) {
                throw new Error('Angel renderer is not ready');
              }
              if (!command || !Number.isInteger(command.id) ||
                  typeof command.type !== 'string') {
                throw new TypeError('Invalid Angel command envelope');
              }
              const handler = commandHandlers.get(command.type);
              if (!handler) {
                throw new Error(`Unsupported Angel command: ${command.type}`);
              }
              return await handler(command.payload || {});
            },
          });
          window.__angelBridge.register('ping', () => ({
            ready: true,
            threeRevision: THREE.REVISION,
          }));
          window.__angelBridge.register('loadScene', (payload) => {
            disposeModel();
            addLofts(Array.isArray(payload.lofts) ? payload.lofts : []);
            addEdges(Array.isArray(payload.edges) ? payload.edges : []);
            const hasGeometry = fitCameraToModel();
            status.hidden = true;
            return {
              rendered: true,
              hasGeometry,
              edgeCount: Array.isArray(payload.edges) ? payload.edges.length : 0,
              loftCount: Array.isArray(payload.lofts) ? payload.lofts.length : 0,
            };
          });
          window.__angelBridge.register(
            'synchronizeOrthographicViewport',
            (payload) => {
              const definition = payload.camera || {};
              const frustum = definition.frustum || {};
              const position = definition.position || {};
              const rotation = definition.rotation || {};
              const values = [
                frustum.left,
                frustum.right,
                frustum.top,
                frustum.bottom,
                frustum.near,
                frustum.far,
                position.x,
                position.y,
                position.z,
              ];
              if (!values.every(Number.isFinite)) {
                throw new TypeError('Invalid orthographic camera payload');
              }
              camera = new THREE.OrthographicCamera(
                frustum.left,
                frustum.right,
                frustum.top,
                frustum.bottom,
                frustum.near,
                frustum.far,
              );
              camera.position.set(position.x, position.y, position.z);
              camera.rotation.set(
                Number(rotation.pitch) || 0,
                Number(rotation.yaw) || 0,
                Number(rotation.roll) || 0,
              );
              camera.zoom = Number(definition.zoom) || 1;
              camera.updateProjectionMatrix();
              renderer.render(scene, camera);
              return { synchronized: true, projection: 'orthographic' };
            },
          );
          window.__angelBridge.register('captureFrame', () => ({
            dataUrl: renderer.domElement.toDataURL('image/png'),
          }));
          window.__angelBridge.register('serializeScene', () => ({
            scene: modelRoot.toJSON(),
          }));
          window.__angelBridge.register('projectWorldPoints', (payload) => {
            if (payload.camera) {
              commandHandlers.get('synchronizeOrthographicViewport')({
                camera: payload.camera,
              });
            }
            const viewport = payload.viewport || {};
            const width = Number(viewport.logicalWidth);
            const height = Number(viewport.logicalHeight);
            if (!(width > 0) || !(height > 0) || !Array.isArray(payload.points)) {
              throw new TypeError('Invalid world-point projection payload');
            }
            return {
              points: payload.points.map((point) => {
                const projected = new THREE.Vector3(
                  Number(point.x),
                  Number(point.y),
                  Number(point.z),
                ).project(camera);
                return {
                  x: (projected.x + 1) * width / 2,
                  y: (1 - projected.y) * height / 2,
                  depth: projected.z,
                };
              }),
            };
          });
          window.__angelBridge.register('unprojectScreenPoint', (payload) => {
            if (payload.camera) {
              commandHandlers.get('synchronizeOrthographicViewport')({
                camera: payload.camera,
              });
            }
            const viewport = payload.viewport || {};
            const localPoint = payload.localPoint || {};
            const width = Number(viewport.logicalWidth);
            const height = Number(viewport.logicalHeight);
            const localX = Number(localPoint.x);
            const localY = Number(localPoint.y);
            const offset = Number(payload.planeOffset) || 0;
            if (!(width > 0) || !(height > 0) ||
                !Number.isFinite(localX) || !Number.isFinite(localY)) {
              throw new TypeError('Invalid screen-point unprojection payload');
            }
            const point = new THREE.Vector3(
              localX / width * 2 - 1,
              1 - localY / height * 2,
              -1,
            ).unproject(camera);
            const direction = point.sub(camera.position).normalize();
            const normal = payload.plane === 'yz'
              ? new THREE.Vector3(1, 0, 0)
              : payload.plane === 'xz'
                ? new THREE.Vector3(0, 1, 0)
                : new THREE.Vector3(0, 0, 1);
            const denominator = normal.dot(direction);
            if (Math.abs(denominator) < 1e-9) {
              throw new RangeError('View ray is parallel to the sketch plane');
            }
            const distance =
              (offset - normal.dot(camera.position)) / denominator;
            const world = camera.position.clone().addScaledVector(
              direction,
              distance,
            );
            return { point: { x: world.x, y: world.y, z: world.z } };
          });
          document.documentElement.dataset.angelReady = 'true';
          status.dataset.state = 'ready';
          status.value =
            `Offline Three.js r${THREE.REVISION} • WebGL ready`;
          console.info(
            `Offline Three.js r${THREE.REVISION}; renderer=${window.__angelRuntime.renderer}`,
          );
          window.dispatchEvent(
            new CustomEvent('angel-three-ready', {
              detail: window.__angelRuntime,
            }),
          );
          const notifyFlutter = () => {
            const host = window.flutter_inappwebview;
            if (host && typeof host.callHandler === 'function') {
              host.callHandler('angelRuntimeReady', window.__angelRuntime);
              return true;
            }
            return false;
          };
          if (!notifyFlutter()) {
            window.addEventListener(
              'flutterInAppWebViewPlatformReady',
              notifyFlutter,
              { once: true },
            );
          }
        } catch (error) {
          document.documentElement.dataset.angelReady = 'false';
          status.dataset.state = 'error';
          status.value = `Renderer error: ${error.message}`;
          throw error;
        }
      })();
    </script>
  </body>
</html>
